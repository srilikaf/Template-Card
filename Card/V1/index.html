<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card V1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <span class="badge-discount">20% OFF</span>

      <img src="card1.png" alt="Headphones" />

      <div class="content">
        <p class="category">Headphones</p>
        <h3 class="title">Noise Cancelling Headphones</h3>

        <div class="rating">
          <span class="star">★</span>
          <span class="star">★</span>
          <span class="star">★</span>
          <span class="star">★</span>
          <span class="star">★</span>
          <span class="count">(125)</span>
        </div>

        <div class="price">
          <span class="new">$79.99</span>
          <span class="old">$99.99</span>
        </div>

        <p class="desc">
          High quality sound with deep bass and comfortable fit.
        </p>

        <button class="btn">
          <i class="fas fa-cart-plus"></i> Add to Cart
        </button>
      </div>
    </div>
  </body>
</html>
